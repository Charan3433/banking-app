name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    name: Backend - Lint & Code Quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pylint black
      - name: Run Flake8
        run: flake8 backend/ --max-line-length=120 --ignore=E501,W503 || true
      - name: Run Black check
        run: black --check backend/ || true
      - name: Run Pylint
        run: pylint backend/app --disable=C0114,C0115,C0116,E0401,R0903 || true

  backend-test:
    runs-on: ubuntu-latest
    name: Backend - Unit Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov
      - name: Run pytest
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --cov=app --cov-report=xml || true
          else
            echo "No tests directory found, skipping tests"
          fi
        working-directory: backend
      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  backend-build:
    runs-on: ubuntu-latest
    name: Backend - Build & Smoke Tests
    needs: [backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Health Check Test
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          client = app.test_client()
          resp = client.get('/api/health')
          assert resp.status_code == 200, f"Health check failed: {resp.status_code}"
          print("✓ Health check passed")
          PY
        working-directory: backend
      - name: Build Docker image (Backend)
        run: docker build -t banking-app-backend:${{ github.sha }} backend/

  frontend-lint:
    runs-on: ubuntu-latest
    name: Frontend - Lint & Code Quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run ESLint
        run: cd frontend && npm run lint 2>/dev/null || echo "ESLint not configured"
      - name: Run Prettier check
        run: cd frontend && npx prettier --check src/ 2>/dev/null || echo "Prettier check skipped"

  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend - Build & Bundle
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build Docker image (Frontend)
        run: docker build -t banking-app-frontend:${{ github.sha }} frontend/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  security-scan:
    runs-on: ubuntu-latest
    name: Security - Dependency & Code Scan
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          wait-for-processing: false

  docker-build-push:
    runs-on: ubuntu-latest
    name: Docker - Build & Push Images
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build backend image
        run: docker build -t banking-app-backend:${{ github.sha }} backend/
      - name: Build frontend image
        run: docker build -t banking-app-frontend:${{ github.sha }} frontend/
      - name: Build and push backend
        continue-on-error: true
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/banking-app-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/banking-app-backend:${{ github.sha }}
      - name: Build and push frontend
        continue-on-error: true
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/banking-app-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/banking-app-frontend:${{ github.sha }}

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: [backend-build, frontend-build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check if docker-compose exists
        id: compose_check
        run: test -f docker-compose.yml && echo "exists=true" || echo "exists=false"
      - name: Start docker-compose services
        if: steps.compose_check.outputs.exists == 'true'
        run: docker-compose up -d
      - name: Wait for services to be healthy
        if: steps.compose_check.outputs.exists == 'true'
        run: sleep 10
      - name: Run integration tests
        if: steps.compose_check.outputs.exists == 'true'
        run: |
          if [ -d "backend/tests" ]; then
            docker-compose exec -T backend python -m pytest tests/ -v || true
          else
            echo "No tests directory found in backend"
          fi
      - name: Cleanup
        if: always() && steps.compose_check.outputs.exists == 'true'
        run: docker-compose down

  notify:
    runs-on: ubuntu-latest
    name: Notifications
    needs: [backend-lint, backend-test, backend-build, frontend-lint, frontend-build, security-scan]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Pipeline completed successfully!"
          else
            echo "❌ Pipeline failed!"
          fi
      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ CI/CD Pipeline Failed - ${{ github.repository }}"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_USERNAME }}
          reply_to: ${{ secrets.EMAIL_USERNAME }}
          headers: |
            Approved: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Pipeline Failure Notification
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            
            View the full workflow run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please check the logs and fix the issues.
      - name: Send email notification on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ CI/CD Pipeline Completed Successfully - ${{ github.repository }}"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_USERNAME }}
          reply_to: ${{ secrets.EMAIL_USERNAME }}
          headers: |
            Approved: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Pipeline Success Notification
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            
            All stages completed successfully!
            
            View the full workflow run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
